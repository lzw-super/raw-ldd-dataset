# Current HONOR MEY-AN00 prototype: 10 s single-frame pseudo-clean sources
# plus condition-matched 1/30 s dark residuals.  This is intentionally a
# smoke/fine-tune run, not a final paired-PSNR experiment.
clean_manifest: data/MEY_AN00/manifests/clean_train.jsonl
dark_manifest: data/MEY_AN00/manifests/dark_train.jsonl
calibration_root: data/MEY_AN00/calibration
# `raw-test/val` is scene-disjoint from `cleanframe`, and is emitted by
# build_phone_manifest.py as a held-out pseudo-clean set.  Its metric remains
# synthetic (not a real noisy-clean PSNR); noisy/ is never used for training.
val_clean_manifest: data/MEY_AN00/manifests/clean_synthetic_val.jsonl
val_dark_manifest: data/MEY_AN00/manifests/dark_val.jsonl
output_dir: experiments/mey_an00_nafnet_w8-d2-s3
init_checkpoint: experiments/sid_sony_nafnet_w8_d2_s3/checkpoints/latest.pth

model: nafnet
model_width: 8
encoder_blocks: [2, 2, 2]
middle_blocks: 2
decoder_blocks: [2, 2, 2]

# Stop after enough steps to check DNG metadata, gradients and I/O.  Do not
# extend this as a final experiment until clean burst masters and scene groups
# have been supplied.
epochs: 500
# max_steps: None
steps_per_epoch: null
batch_size: 1
num_workers: 2
patch_size: 512
crops_per_image: 2
# For ratio=100/250 the simulated short exposures are 1/10 s and 1/25 s.
# Their signal-independent residual is intentionally approximated by the same
# ISO/mode 1/30 s dark bank; ratio=300 remains exposure-matched.
ratios: [100.0, 250.0, 300.0]
dark_exposure_policy: approximate_reuse_1_30s
# PMN/SID-aligned per-pixel piecewise k*ISO+b calibration.  The old
# per_condition_mean mode is retained only for explicit ablation.
dark_shading_model: continuous_iso_fit
clean_cache_size: 4
dark_cache_size: 2
max_target_saturation_fraction: 0.01
max_crop_attempts: 32
exposure_ratio_tolerance: 0.02

synthesis: hybrid
learning_rate: 0.00001
beta1: 0.9
beta2: 0.999
weight_decay: 0.0
warmup_epochs: 1
grad_clip: null
amp: false
device: cuda:1
seed: 1

# Fixed held-out scenes plus held-out dark residuals.  The three values are
# separately persisted as synthetic_heldout_psnr_by_ratio in metrics.jsonl.
# ratio 300 is exact; 100/250 are the documented 1/30 s dark-reuse protocol.
validate_every: 1
validate_steps: 10
val_ratios: [100.0, 250.0, 300.0]
val_crops_per_image: 1
val_seed: 10001
save_every: 1
keep_checkpoints: 3
log_every: 10
