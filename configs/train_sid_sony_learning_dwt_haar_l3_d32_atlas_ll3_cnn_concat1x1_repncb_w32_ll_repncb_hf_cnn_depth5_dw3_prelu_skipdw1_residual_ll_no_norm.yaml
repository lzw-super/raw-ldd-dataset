# HF processor: DW1x1(z) + PReLU(DW3x3(z)); depthwise skip, identity init, no skip activation.
patch_dir: ../../Datasets/SID-sub/Sony_train_long_patches
pair_list: ../../Datasets/SID-sub/Sony_train_list.txt
sid_long_dir: ../../Datasets/SID-sub/Sony/long
clean_source: raw
manifest: infos/SID_train_clean_raw.json
val_pair_list: ../../Datasets/SID-sub/Sony_val_list.txt
dark_root: biasframe_et_1_30
pmn_resource_dir: resources/SonyA7S2

model: learning_dwt_repncb

# Equation (5): L = 0.6 L_raw + 0.4 L_chromatic.
# Repository tensors are [R,G1,G2,B]; the loss argument is semantic
# [R,G1,B,G2], hence the index mapping below.
raw_loss_weight: 0.6
chromatic_loss_weight: 0.4
chromatic_channel_order: [0, 1, 3, 2]

output_dir: experiments/sid_sony_learning_dwt_haar_l3_d32_atlas_ll3_cnn_concat1x1_repncb_w32_ll_repncb_hf_cnn_depth5_dw3_prelu_skipdw1_residual_ll_no_norm

# Training settings copied from the MRLFN d32 reference for comparison.
# Train HF processors, LL restoration and refinement jointly from scratch.
epochs: 1000
# max_steps: 257600
steps_per_epoch: null
batch_size: 32
num_workers: 8
patch_size: 256
crops_per_image: 16
ratios: [100, 250, 300]
clean_cache_size: 16
dark_cache_size: 2

synthesis: ratio_aware
k_scale: 0.1

# Same Adam/LR/warmup settings as the supplied d32 reference.
learning_rate: 0.0002
min_learning_rate: 0.0
beta1: 0.9
beta2: 0.999
adam_epsilon: 0.0000001
weight_decay: 0.0
warmup_epochs: 10
grad_clip: null
amp: false
device: cuda:0
seed: 2026

validate_every: 50
validate_steps: 40
save_every: 10
keep_checkpoints: 3
log_every: 20

# Fixed Haar DWT/IWT; three independent CNNs consume signed 12-channel HF inputs.
# Legacy predictor width/depth/context and threshold settings are inactive in hf_cnn mode.
dwt_width: 16
dwt_depth: 3
dwt_context: atlas
dwt_shrink_ll: false  # Separate LL restoration; HF uses direct CNN outputs.
dwt_leak: 0.0
dwt_normalize_bands: true
dwt_pad_input: true
dwt_init_threshold: 0.01
dwt_init_ll_threshold: 0.001
dwt_wavelet: haar
dwt_levels: 3
dwt_magnitude_input: true
dwt_condition_bands: false
dwt_ll_max_threshold: 0.01
dwt_shrink_mode: soft

# LL depth 5: input convolution, three internal Rep-NCB blocks, output convolution.
dwt_ll_mode: ll_only
dwt_ll_width: 32
dwt_ll_depth: 5

# Concatenate [CNN output (4ch), original LL (4ch)], then learned 1x1 Conv 8->4.
dwt_ll_fusion: concat_1x1

# Refinement settings. K=1 bypasses S2D/D2S; width is independent of K.
refine_s2d_factor: 2
refine_width: 32
refine_num_blocks: 5
refine_skip_source: noisy  # noisy=original I; preliminary=wavelet output I-

# Refiner: stem 16->32, five Rep-NCB blocks 32->32, head 32->16.
# Concatenate with 16-channel S2D(I); fusion 32->16, then D2S(2).

# Internal LL 32->32 blocks use Rep-NCB with PReLU.
dwt_ll_block_type: repncb

# Each level concatenates [LH, HL, HH]; no threshold parameters or atlas predictor.
dwt_threshold_mode: hf_cnn
dwt_hf_cnn_variant: dw3_prelu_skipdw1_residual

# Threshold-only settings above are inactive for hf_cnn; no HF normalization/shrinkage.

# Feed original LL into its CNN/fusion; no input/output rescaling.
dwt_ll_normalize: false

# Train all parameters from scratch; no warm start or distillation.
resume: null
init_checkpoint: null
